<!doctype html>
<!-- Page « introuvable » : servie automatiquement par Vercel (code 404) pour
     toute adresse qui n'existe pas. Fichier statique, indépendant
     d'index.html et non généré au build — même typo et mêmes couleurs que
     le site, en français et en anglais. noindex : jamais dans Google. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page introuvable — Alexis Vassivière</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{--bg:#ffffff;--ink:#0a0a0a;--ink-soft:#6f6f6f;--line:#ebebeb}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  body{min-height:100vh;display:flex;flex-direction:column}
  header{padding:30px 36px 18px;text-align:center}
  .brand{font-weight:400;letter-spacing:.04em;font-size:clamp(20px,2vw,30px);text-transform:uppercase;line-height:1}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 24px 72px;text-align:center}
  h1{margin:0;font-weight:400;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
  p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.7;max-width:46ch}
  nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
  nav a{padding:6px 0;border-bottom:1px solid var(--ink)}
  nav a:hover{opacity:.6}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
  .en{font-size:13px}
</style>
</head>
<body>
<header><a href="/" class="brand">Alexis Vassivière</a></header>
<main>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a changé d'adresse.</p>
  <nav aria-label="Pages du site">
    <a href="/">Portfolio</a>
    <a href="/projets/">Projets</a>
    <a href="/contact/">Contact</a>
  </nav>
  <p class="en" lang="en">Page not found — <a href="/en/" style="border-bottom:1px solid var(--ink-soft)">English version</a></p>
</main>
</body>
</html>
